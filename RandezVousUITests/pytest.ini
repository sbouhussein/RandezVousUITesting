[pytest]
python_files = test.py
testpaths = tests
pythonpath = .
addopts =
    --import-mode=importlib
    -v
    -s
    --capture=tee-sys
markers =
    cleanup: Custom mark for post-test database/account cleanup logic
    smoke: fast checks of the most important flows
    ux: user-facing flows (joining, activities, feed, leaderboard, entry points)
    access: bans, domain restrictions, ended or expired quests and onboarding fallbacks
    push: notification tests that send real pushes (slow, depend on external services)
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:urllib3 v2 only supports OpenSSL:UserWarning